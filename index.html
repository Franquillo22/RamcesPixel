<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAg8cND_1e8MaY3i9YDoIBUfSQON9LQSck",
        authDomain: "ramces-pixel.firebaseapp.com",
        projectId: "ramces-pixel",
        storageBucket: "ramces-pixel.firebasestorage.app",
        messagingSenderId: "372884638030",
        appId: "1:372884638030:web:528fefc959e14fd5f6361f",
        measurementId: "G-D7P8MMS7GG"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // Login con Google
    function loginWithGoogle() {
        firebase.auth().signInWithPopup(googleProvider)
            .then((result) => {
                localStorage.setItem('auth_type', 'Google');
                mostrarPasoVincular();
            })
            .catch((error) => {
                alert("Error con Google: " + error.message);
            });
    }

    // Login con Discord (Tu app real)
    function loginWithDiscord() {
        const discordUrl = "https://discord.com/oauth2/authorize?client_id=1542606598084497418&response_type=token&redirect_uri=https%3A%2F%2Ffranquillo22.github.io%2FRamcesPixel%2F&scope=identify";
        window.location.href = discordUrl;
    }

    // Al cargar la página
    window.addEventListener('load', () => {
        // Retorno de Discord
        const hash = window.location.hash;
        if (hash.includes('access_token')) {
            localStorage.setItem('auth_type', 'Discord');
            openModal('authModal');
            mostrarPasoVincular();
            history.replaceState(null, "", window.location.pathname);
        }

        // Recuperar sesión guardada
        const savedNick = localStorage.getItem('mc_nick');
        const savedEdition = localStorage.getItem('mc_edition');
        if (savedNick) {
            actualizarInterfazUsuario(savedNick, savedEdition);
        }
    });

    function mostrarPasoVincular() {
        const step1 = document.getElementById('authStep1');
        const step2 = document.getElementById('authStep2');
        if (step1) step1.style.display = 'none';
        if (step2) step2.style.display = 'block';
    }

    // --- 2. VERIFICACIÓN CORREGIDA CON CROS PROXY (NO BLOQUEA PREMIUMS) ---
    async function validarYGuardarNick(e) {
        e.preventDefault();
        const edition = document.getElementById('mcEdition').value;
        let nick = document.getElementById('mcNickInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        const btnVerify = document.getElementById('btnVerify');

        if (!nick) return;

        if (statusMsg) {
            statusMsg.style.color = '#ff9d00';
            statusMsg.textContent = 'Verificando cuenta...';
        }
        if (btnVerify) btnVerify.disabled = true;

        if (edition === 'java') {
            let esValida = false;
            let realUsername = nick;

            try {
                // Consulta con Proxy CORS para evitar bloqueos del navegador
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://api.mojang.com/users/profiles/minecraft/' + nick)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.contents && JSON.parse(data.contents).id) {
                        const parsedData = JSON.parse(data.contents);
                        realUsername = parsedData.name;
                        esValida = true;
                    }
                }
            } catch (err) {
                // Si la red falla por completo, dejamos pasar para no bloquear al usuario
                esValida = true; 
            }

            if (!esValida) {
                if (statusMsg) {
                    statusMsg.style.color = '#ff4d4d';
                    statusMsg.textContent = '❌ Nick Premium no encontrado en Mojang. Revisa las mayúsculas/minúsculas.';
                }
                if (btnVerify) btnVerify.disabled = false;
                return;
            }
            nick = realUsername;
        } else {
            if (nick.length < 3 || nick.length > 24) {
                if (statusMsg) {
                    statusMsg.style.color = '#ff4d4d';
                    statusMsg.textContent = '❌ Nick de Bedrock inválido (3 a 24 caracteres).';
                }
                if (btnVerify) btnVerify.disabled = false;
                return;
            }
        }

        // Guardar estado
        localStorage.setItem('mc_nick', nick);
        localStorage.setItem('mc_edition', edition);

        actualizarInterfazUsuario(nick, edition);
        closeModal('authModal');

        if (btnVerify) btnVerify.disabled = false;
        if (statusMsg) statusMsg.textContent = '';
    }

    // --- 3. ESTADO DE USUARIO Y CERRAR SESIÓN ---
    function actualizarInterfazUsuario(nick, edition) {
        const icon = edition === 'bedrock' ? '📱' : '💻';
        const userBtn = document.getElementById('userBtn');
        let logoutBtn = document.getElementById('logoutBtn');

        if (userBtn) {
            userBtn.textContent = `${icon} ${nick}`;
            userBtn.onclick = null;
        }

        // Crear botón de cerrar sesión si no existe
        if (!logoutBtn && userBtn && userBtn.parentNode) {
            logoutBtn = document.createElement('button');
            logoutBtn.id = 'logoutBtn';
            logoutBtn.textContent = 'Cerrar Sesión';
            logoutBtn.style.cssText = 'background:#e74c3c; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:bold; margin-left:10px;';
            logoutBtn.onclick = cerrarSesion;
            userBtn.parentNode.appendChild(logoutBtn);
        } else if (logoutBtn) {
            logoutBtn.style.display = 'inline-block';
        }
    }

    function cerrarSesion() {
        localStorage.removeItem('mc_nick');
        localStorage.removeItem('mc_edition');
        localStorage.removeItem('auth_type');

        const userBtn = document.getElementById('userBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (userBtn) {
            userBtn.textContent = '👤 Iniciar Sesión';
            userBtn.onclick = () => openModal('authModal');
        }
        if (logoutBtn) {
            logoutBtn.style.display = 'none';
        }

        const step1 = document.getElementById('authStep1');
        const step2 = document.getElementById('authStep2');
        if (step1) step1.style.display = 'block';
        if (step2) step2.style.display = 'none';

        alert("Sesión cerrada correctamente.");
    }

    function openModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
    }
    function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
    }
</script>

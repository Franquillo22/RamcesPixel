<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RamcesPixelAI & Tienda</title>
  <style>
    /* Desplazamiento Suave (Smooth Scroll) */
    html {
      scroll-behavior: smooth;
    }

    /* Scrollbar Personalizada y Estética */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1a24;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #6366f1, #a855f7);
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #4f46e5, #9333ea);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f17;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1, h2 {
      margin-bottom: 10px;
      color: #a855f7;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .card {
      background-color: #181824;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Chat RamcesPixelAI */
    #chat-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      padding: 15px;
      background-color: #0d0d14;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .user-msg {
      align-self: flex-end;
      background: #6366f1;
      color: #fff;
    }

    .ai-msg {
      align-self: flex-start;
      background: #27273a;
      color: #e2e8f0;
      border-left: 3px solid #a855f7;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input, select {
      flex: 1;
      padding: 12px;
      border: 1px solid #2e2e42;
      border-radius: 6px;
      background: #0d0d14;
      color: #fff;
      font-size: 14px;
    }

    button {
      background: linear-gradient(90deg, #6366f1, #a855f7);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Tienda y Checkout */
    .shop-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .item-card {
      background: #0d0d14;
      border: 1px solid #2e2e42;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .payment-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      background: #0d0d14;
      padding: 15px;
      border-radius: 8px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .success {
      background-color: #166534;
      color: #bbf7d0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Asistente de IA -->
    <div class="card">
      <h2>RamcesPixelAI</h2>
      <div id="chat-box">
        <div class="message ai-msg">¡Hola! Soy <b>RamcesPixelAI</b>. ¿En qué te puedo ayudar hoy?</div>
      </div>
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje a RamcesPixelAI..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <!-- Tienda y Pasarela de Pago -->
    <div class="card">
      <h2>Tienda Oficial</h2>
      <div class="shop-items">
        <div class="item-card">
          <h3>Pase VIP</h3>
          <p>$9.99 USD</p>
          <button onclick="selectProduct('Pase VIP', 9.99)">Comprar</button>
        </div>
        <div class="item-card">
          <h3>Pack Monedas</h3>
          <p>$4.99 USD</p>
          <button onclick="selectProduct('Pack Monedas', 4.99)">Comprar</button>
        </div>
      </div>

      <div id="checkout-section" style="display: none;">
        <h3>Finalizar Compra: <span id="selected-product">-</span></h3>
        <form class="payment-form" id="payment-form" onsubmit="processPayment(event)">
          <input type="text" placeholder="Nombre en la tarjeta" required>
          <input type="text" id="card-number" maxlength="19" placeholder="Número de Tarjeta (16 dígitos)" required>
          <div class="form-row">
            <input type="text" maxlength="5" placeholder="MM/AA" required>
            <input type="password" maxlength="4" placeholder="CVV" required>
          </div>
          <button type="submit">Pagar Ahora</button>
        </form>
        <div id="payment-status" class="status-msg"></div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JrO7yFEiop_tu5zfe04vNXUE-JZq9hjHrI8MZlmhW_0g";

    // Llamada a la API de RamcesPixelAI
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user-msg');
      input.value = '';

      const loadingMsg = appendMessage('RamcesPixelAI está pensando...', 'ai-msg');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: text }]
            }]
          })
        });

        const data = await response.json();
        loadingMsg.remove();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          appendMessage(data.candidates[0].content.parts[0].text, 'ai-msg');
        } else {
          appendMessage('Error: No se obtuvo respuesta de la API.', 'ai-msg');
        }
      } catch (error) {
        loadingMsg.remove();
        appendMessage('Error al conectar con el servicio de RamcesPixelAI.', 'ai-msg');
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // Funciones de la Tienda
    function selectProduct(name, price) {
      document.getElementById('checkout-section').style.display = 'block';
      document.getElementById('selected-product').textContent = `${name} ($${price} USD)`;
      document.getElementById('checkout-section').scrollIntoView({ behavior: 'smooth' });
    }

    function processPayment(e) {
      e.preventDefault();
      const status = document.getElementById('payment-status');
      status.style.display = 'block';
      status.className = 'status-msg success';
      status.textContent = '¡Pago procesado con éxito! Tu compra ha sido activada.';

      setTimeout(() => {
        document.getElementById('payment-form').reset();
        document.getElementById('checkout-section').style.display = 'none';
        status.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>

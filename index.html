<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RamcesPixel - Servidor de Minecraft</title>
    
    <!-- Firebase SDKs (Versión CDN / Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; background: #090d16; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { background: rgba(18, 25, 44, 0.95); border: 3px solid #ff9d00; border-radius: 16px; padding: 40px; text-align: center; max-width: 500px; width: 90%; }
        h1 { color: #ff9d00; margin-bottom: 10px; }
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; margin: 8px 0; width: 100%; font-size: 1rem; }
        .btn-discord { background: #5865F2; color: white; }
        .btn-google { background: #ffffff; color: #333; }
        .btn-mc { background: #ff9d00; color: black; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-content { background: #12192c; padding: 30px; border-radius: 12px; border: 2px solid #ff9d00; width: 90%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ff9d00; background: #090d16; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>RamcesPixel</h1>
        <p style="margin-bottom: 20px;">Servidor Java & Bedrock</p>
        <button class="btn btn-mc" id="userBtn" onclick="openModal('authModal')">👤 Iniciar Sesión / Vincular</button>
    </div>

    <!-- MODAL DE AUTENTICACIÓN -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #ff9d00; margin-bottom: 15px;">🔐 Iniciar Sesión</h2>
            
            <!-- PASO 1: LOGIN SOCIAL -->
            <div id="authStep1">
                <p style="font-size:0.9rem; margin-bottom:12px;">Elige tu método de ingreso:</p>
                <button class="btn btn-google" onclick="loginWithGoogle()">🌐 Entrar con Google</button>
                <button class="btn btn-discord" onclick="loginWithDiscord()">🎮 Entrar con Discord</button>
            </div>

            <!-- PASO 2: VINCULAR NICK (JAVA Y BEDROCK) -->
            <div id="authStep2" style="display: none;">
                <p style="color: #00d4ff; font-size:0.9rem; margin-bottom:10px;">¡Autenticado con éxito! Elige tu plataforma e ingresa tu Nick:</p>
                <form onsubmit="validarYGuardarNick(event)">
                    <select id="mcEdition">
                        <option value="java">Minecraft Java Edition</option>
                        <option value="bedrock">Minecraft Bedrock / Celular / Consola</option>
                    </select>

                    <input type="text" id="mcNickInput" placeholder="Tu usuario exacto" required>
                    <button type="submit" class="btn btn-mc">Vincular Usuario</button>
                </form>
            </div>
            
            <button style="background:none; border:none; color:#aaa; margin-top:10px; cursor:pointer;" onclick="closeModal('authModal')">Cerrar</button>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG REAL (TU PROYECTO) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAg8cND_1e8MaY3i9YDoIBUfSQON9LQSck",
            authDomain: "ramces-pixel.firebaseapp.com",
            projectId: "ramces-pixel",
            storageBucket: "ramces-pixel.firebasestorage.app",
            messagingSenderId: "372884638030",
            appId: "1:372884638030:web:528fefc959e14fd5f6361f",
            measurementId: "G-D7P8MMS7GG"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let loggedUserEmail = null;

        // Iniciar Sesión con Google
        function loginWithGoogle() {
            firebase.auth().signInWithPopup(googleProvider)
                .then((result) => {
                    loggedUserEmail = result.user.email;
                    mostrarPasoVincular();
                })
                .catch((error) => {
                    alert("Error en autenticación con Google: " + error.message);
                });
        }

        // --- 2. DISCORD AUTH REAL (TU ENLACE) ---
        function loginWithDiscord() {
            // Se usa response_type=token para leerlo directo sin backend
            const discordUrl = "https://discord.com/oauth2/authorize?client_id=1542606598084497418&response_type=token&redirect_uri=https%3A%2F%2Ffranquillo22.github.io%2FRamcesPixel%2F&scope=identify";
            window.location.href = discordUrl;
        }

        // Detectar si el usuario regresa de Discord
        window.addEventListener('load', () => {
            const hash = window.location.hash;
            if (hash.includes('access_token')) {
                const params = new URLSearchParams(hash.replace('#', '?'));
                const token = params.get('access_token');
                
                // Pedir datos del usuario a Discord
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${token}` }
                })
                .then(res => res.json())
                .then(user => {
                    loggedUserEmail = `${user.username}#${user.discriminator || '0'}`;
                    openModal('authModal');
                    mostrarPasoVincular();
                    history.replaceState(null, "", window.location.pathname);
                })
                .catch(() => alert("Error al obtener datos de Discord"));
            }

            // Cargar sesión guardada previamente
            const savedNick = localStorage.getItem('mc_nick');
            const savedEdition = localStorage.getItem('mc_edition');
            if (savedNick) {
                actualizarBotonUsuario(savedNick, savedEdition);
            }
        });

        function mostrarPasoVincular() {
            document.getElementById('authStep1').style.display = 'none';
            document.getElementById('authStep2').style.display = 'block';
        }

        // --- 3. VALIDACIÓN DE NICK (JAVA Y BEDROCK) ---
        async function validarYGuardarNick(e) {
            e.preventDefault();
            const edition = document.getElementById('mcEdition').value;
            let nick = document.getElementById('mcNickInput').value.trim();

            if (!nick) return;

            if (edition === 'java') {
                // Validación para cuentas Java (API de Mojang)
                try {
                    const res = await fetch(`https://api.ashcon.app/mojang/v2/user/${nick}`);
                    if (!res.ok) {
                        alert("❌ La cuenta Java no existe o no es Premium. Si juegas desde celular o Consola, cambia el selector a Bedrock.");
                        return;
                    }
                    const data = await res.json();
                    nick = data.username; // Mayúsculas y minúsculas exactas
                } catch (err) {
                    alert("No se pudo verificar el nick con Mojang. Inténtalo de nuevo.");
                    return;
                }
            } else {
                // Validación para Bedrock (Soporta '.' o '_' como prefijo)
                if (nick.length < 3 || nick.length > 20) {
                    alert("❌ Un nick de Bedrock debe tener entre 3 y 20 caracteres.");
                    return;
                }
            }

            // Guardar localmente
            localStorage.setItem('mc_nick', nick);
            localStorage.setItem('mc_edition', edition);

            actualizarBotonUsuario(nick, edition);
            closeModal('authModal');
            alert(`¡Cuenta vinculada exitosamente como ${nick} (${edition.toUpperCase()})!`);
        }

        function actualizarBotonUsuario(nick, edition) {
            const icon = edition === 'bedrock' ? '📱' : '💻';
            document.getElementById('userBtn').textContent = `${icon} ${nick}`;
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RamcesPixelAI - Plataforma Oficial</title>
  <style>
    /* Desplazamiento Suave */
    html {
      scroll-behavior: smooth;
    }

    /* Scrollbar Personalizada */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #8b5cf6, #d946ef);
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #7c3aed, #c026d3);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #09090e;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .card {
      background: #12121c;
      border: 1px solid #27273a;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Header e Identidad RamcesPixelAI */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .brand-header img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }

    .brand-header h2 {
      margin: 0;
      font-size: 1.5rem;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Chat UI */
    #chat-box {
      height: 350px;
      overflow-y: auto;
      border: 1px solid #232334;
      border-radius: 10px;
      padding: 15px;
      background: #0a0a10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: #6366f1;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .ai-msg {
      align-self: flex-start;
      background: #1c1c2b;
      color: #e2e8f0;
      border-left: 3px solid #a855f7;
      border-bottom-left-radius: 2px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input, select {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #27273a;
      border-radius: 8px;
      background: #0a0a10;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      background: linear-gradient(90deg, #8b5cf6, #d946ef);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Sección Tienda */
    .shop-title {
      font-size: 1.4rem;
      color: #a855f7;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .shop-card {
      background: #0a0a10;
      border: 1px solid #232334;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .shop-card h3 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
    }

    .shop-card p {
      color: #a1a1aa;
      margin: 0 0 15px 0;
      font-weight: bold;
    }

    /* Checkout Pasarela */
    .checkout-box {
      background: #0a0a10;
      border: 1px solid #27273a;
      padding: 20px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .status-alert {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: center;
    }

    .status-alert.success {
      background: #14532d;
      color: #4ade80;
      border: 1px solid #22c55e;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Chat Principal RamcesPixelAI -->
    <div class="card">
      <div class="brand-header">
        <img src="https://raw.githubusercontent.com/ramcespixel/assets/main/ramces%20pixel.png" alt="RamcesPixel Logo" onerror="this.src='https://via.placeholder.com/40?text=RP'">
        <h2>RamcesPixelAI</h2>
      </div>
      
      <div id="chat-box">
        <div class="message ai-msg">¡Hola! Soy <b>RamcesPixelAI</b>. ¿En qué puedo ayudarte el día de hoy?</div>
      </div>

      <div class="input-group">
        <input type="text" id="user-input" placeholder="Escribe un mensaje a RamcesPixelAI..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <!-- Tienda Oficial -->
    <div class="card">
      <h2 class="shop-title">Tienda Oficial</h2>
      
      <div class="shop-grid">
        <div class="shop-card">
          <h3>Rango VIP</h3>
          <p>$9.99 USD</p>
          <button onclick="openCheckout('Rango VIP', 9.99)">Comprar</button>
        </div>
        <div class="shop-card">
          <h3>Pack Monedas</h3>
          <p>$4.99 USD</p>
          <button onclick="openCheckout('Pack Monedas', 4.99)">Comprar</button>
        </div>
        <div class="shop-card">
          <h3>Suscripción Premium</h3>
          <p>$14.99 USD</p>
          <button onclick="openCheckout('Suscripción Premium', 14.99)">Comprar</button>
        </div>
      </div>

      <!-- Pasarela de Pago Dinámica -->
      <div id="checkout-container" class="checkout-box" style="display: none;">
        <h3 style="margin: 0;">Detalles de Pago: <span id="item-name-display" style="color: #a855f7;"></span></h3>
        
        <form class="form-group" id="payment-form" onsubmit="handlePayment(event)">
          <input type="text" placeholder="Nombre en la tarjeta" required>
          <input type="text" id="card-num" maxlength="19" placeholder="Número de Tarjeta (16 dígitos)" pattern="[0-9\s]{13,19}" required>
          <div class="form-row">
            <input type="text" maxlength="5" placeholder="MM/AA" pattern="(0[1-9]|1[0-2])\/([0-9]{2})" required>
            <input type="password" maxlength="4" placeholder="CVV" pattern="[0-9]{3,4}" required>
          </div>
          <button type="submit">Procesar Pago</button>
        </form>

        <div id="payment-alert" class="status-alert"></div>
      </div>
    </div>
  </div>

  <script>
    // Motor de respuestas RamcesPixelAI
    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user-msg');
      input.value = '';

      const loading = appendMessage('RamcesPixelAI está pensando...', 'ai-msg');

      setTimeout(() => {
        loading.remove();
        const responseText = generateAIResponse(text);
        appendMessage(responseText, 'ai-msg');
      }, 600);
    }

    function generateAIResponse(query) {
      const q = query.toLowerCase();
      if (q.includes('hola') || q.includes('buenas')) return '¡Hola! ¿Cómo estás? ¿En qué puedo ayudarte hoy?';
      if (q.includes('tienda') || q.includes('comprar')) return 'Puedes revisar los productos disponibles en la sección de la Tienda Oficial más abajo.';
      if (q.includes('quien eres') || q.includes('quién eres')) return 'Soy RamcesPixelAI, tu asistente virtual inteligente integrado.';
      return `He procesado tu mensaje sobre "${query}". ¿Hay algo más en lo que te pueda colaborar?`;
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `message ${className}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    // Funciones de la Tienda y Pasarela de Pago
    function openCheckout(itemName, price) {
      const container = document.getElementById('checkout-container');
      document.getElementById('item-name-display').textContent = `${itemName} - $${price} USD`;
      container.style.display = 'block';
      container.scrollIntoView({ behavior: 'smooth' });
    }

    function handlePayment(e) {
      e.preventDefault();
      const alertBox = document.getElementById('payment-alert');
      alertBox.className = 'status-alert success';
      alertBox.textContent = '¡Pago completado con éxito! Gracias por tu compra.';
      alertBox.style.display = 'block';

      setTimeout(() => {
        document.getElementById('payment-form').reset();
        document.getElementById('checkout-container').style.display = 'none';
        alertBox.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>

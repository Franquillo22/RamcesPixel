<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RamcesPixel - Servidor de Minecraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Imagen de fondo en vivo */
            background: linear-gradient(rgba(10, 15, 29, 0.88), rgba(10, 15, 29, 0.95)), 
                        url('https://i.imgur.com/uR1623C.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(18, 25, 44, 0.88);
            border: 3px solid #ff9d00;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 157, 0, 0.35);
            backdrop-filter: blur(8px);
        }

        .logo-header {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(0, 162, 255, 0.6));
        }

        h1 {
            font-size: 2.2rem;
            color: #ff9d00;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 10px;
        }

        p {
            color: #c0d8f0;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .ip-card {
            background: #0f172a;
            border: 2px dashed #00a2ff;
            border-radius: 10px;
            padding: 15px 25px;
            margin-bottom: 30px;
            display: inline-block;
            box-shadow: inset 0 0 10px rgba(0, 162, 255, 0.2);
        }

        .ip-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00d4ff;
            letter-spacing: 1px;
            user-select: all;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-discord {
            background: linear-gradient(135deg, #5865F2, #404EED);
            color: #ffffff;
            border: 2px solid #7983f5;
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        .btn-tienda {
            background: linear-gradient(135deg, #ff9d00, #e67e00);
            color: #ffffff;
            border: 2px solid #ffbe53;
        }

        .btn-tienda:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 157, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo cargado directamente -->
        <img src="logo.png" alt="RamcesPixel Logo" class="logo-header" onerror="this.src='logo.jpg';">

        <h1>¡Bienvenido a RamcesPixel!</h1>
        <p>Hecho Por Ramces Explota Baños</p>

        <!-- Tarjeta de IP -->
        <div class="ip-card">
            <span class="ip-text">RamcesPixelmc.aternos.me</span>
        </div>

        <!-- Botones interactivos -->
        <div class="buttons-container">
            <a href="https://discord.gg/F5B5br4WH" target="_blank" class="btn btn-discord">Unirse al Discord</a>
            <a href="#" class="btn btn-tienda">Tienda VIP</a>
        </div>
    </div>

</body>
</html>

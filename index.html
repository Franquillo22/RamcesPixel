<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RamcesPixel - Tienda Oficial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #090d16; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #12192c; border: 2px solid #ff9d00; border-radius: 12px; padding: 30px; max-width: 480px; width: 100%; text-align: center; }
        h1 { color: #ff9d00; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #00d4ff; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ff9d00; background: #0b101d; color: #fff; outline: none; }
        
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .btn-pay { background: linear-gradient(135deg, #ff9d00, #e67e00); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-pay:hover { opacity: 0.9; }

        .error-msg { background: #ff4d4d; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 12px; display: none; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>💳 Pasarela de Pago VIP</h1>
    <div id="errorBox" class="error-msg"></div>

    <form id="paymentForm" onsubmit="validarYProcesar(event)">
        <div class="form-group">
            <label>Usuario de Minecraft (Nick):</label>
            <input type="text" id="mcUser" placeholder="Tu nick exacto" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Tipo de Tarjeta:</label>
                <select id="cardType" required>
                    <option value="visa_debito">Visa Débito</option>
                    <option value="visa_credito">Visa Crédito</option>
                    <option value="mastercard_debito">Mastercard Débito</option>
                    <option value="mastercard_credito">Mastercard Crédito</option>
                </select>
            </div>
            <div class="form-group">
                <label>Código Postal (CP):</label>
                <input type="text" id="zipCode" placeholder="Ej. 72000" maxlength="5" pattern="\d{5}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Número de Tarjeta (16 dígitos):</label>
            <input type="text" id="cardNumber" placeholder="4000 0000 0000 0000" maxlength="19" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Expiración (MM/AA):</label>
                <input type="text" id="expDate" placeholder="MM/AA" maxlength="5" required>
            </div>
            <div class="form-group">
                <label>CVV / CVC:</label>
                <input type="password" id="cvv" placeholder="123" maxlength="4" required>
            </div>
        </div>

        <button type="submit" class="btn-pay">Pagar Rango VIP ($5.99 USD)</button>
    </form>
</div>

<script>
    // Algoritmo de Luhn para detectar tarjetas falsas
    function checkLuhn(cardNumber) {
        let s = 0;
        let doubleDigit = false;
        for (let i = cardNumber.length - 1; i >= 0; i--) {
            let digit = parseInt(cardNumber.charAt(i));
            if (doubleDigit) {
                digit *= 2;
                if (digit > 9) digit -= 9;
            }
            s += digit;
            doubleDigit = !doubleDigit;
        }
        return (s % 10) === 0;
    }

    // Validación de la fecha de vencimiento
    function isFutureDate(mm, yy) {
        const now = new Date();
        const currentYear = parseInt(now.getFullYear().toString().slice(-2));
        const currentMonth = now.getMonth() + 1;

        const expMonth = parseInt(mm);
        const expYear = parseInt(yy);

        if (expMonth < 1 || expMonth > 12) return false;
        if (expYear < currentYear) return false;
        if (expYear === currentYear && expMonth < currentMonth) return false;
        
        return true;
    }

    function validarYProcesar(e) {
        e.preventDefault();
        const errorBox = document.getElementById('errorBox');
        errorBox.style.display = 'none';

        const user = document.getElementById('mcUser').value.trim();
        const rawCard = document.getElementById('cardNumber').value.replace(/\s+/g, '');
        const exp = document.getElementById('expDate').value;
        const cvv = document.getElementById('cvv').value;
        const zip = document.getElementById('zipCode').value;

        // 1. Validar Número de Tarjeta con Algoritmo de Luhn
        if (!/^\d{16}$/.test(rawCard) || !checkLuhn(rawCard)) {
            showError("❌ Tarjeta inválida o falsa. Comprueba el número de 16 dígitos.");
            return;
        }

        // 2. Validar Fecha de Expiración
        const expParts = exp.split('/');
        if (expParts.length !== 2 || !isFutureDate(expParts[0], expParts[1])) {
            showError("❌ La tarjeta está vencida o la fecha es incorrecta (Formato MM/AA).");
            return;
        }

        // 3. Validar CVV
        if (!/^\d{3,4}$/.test(cvv)) {
            showError("❌ El código CVV debe ser de 3 o 4 dígitos.");
            return;
        }

        // 4. Validar Código Postal
        if (!/^\d{5}$/.test(zip)) {
            showError("❌ El Código Postal debe contener 5 dígitos.");
            return;
        }

        // SI PASA TODAS LAS VALIDACIONES:
        alert(`✅ Datos validados correctamente para ${user}.\nRedirigiendo al Staff en Discord...`);
        window.open('https://discord.gg/F5B5br4WH', '_blank');
    }

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }
</script>

</body>
</html>
